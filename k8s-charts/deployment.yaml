apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: emails
  labels:
    app: email-service
spec:
  # Sessions and Outlook OAuth tokens are held in memory, so keep a single replica
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      # Required if the GHCR package is private:
      # kubectl create secret docker-registry ghcr-secret --docker-server=ghcr.io \
      #   --docker-username=<user> --docker-password=<PAT with read:packages>
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: email-service
          image: ghcr.io/organization/project-name/email-service:dev-v0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: email-service-config
            - secretRef:
                name: email-service-secrets
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: emails
  labels:
    app: email-service
spec:
  selector:
    app: email-service
  ports:
    - name: http
      port: 80
      targetPort: http
