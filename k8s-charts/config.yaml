apiVersion: v1
kind: ConfigMap
metadata:
  name: email-service-config
  namespace: emails
  labels:
    app: email-service
data:
  PORT: "3003"
  # Custom SMTP (default emailType)
  MAIL_HOST: "mail.example.com"
  MAIL_PORT: "465"
  MAIL_USER: "noreply@example.com"
  # Gmail / Outlook SMTP users
  SMTP_USER: "noreply@example.com"
  OUTLOOK_USER: "noreply@example.com"
  # Microsoft Graph
  OUTLOOK_TENANT_ID: "<tenant-id>"
  OUTLOOK_AUTH_TENANT: "common"
  OUTLOOK_CLIENT_ID: "<client-id>"
  OUTLOOK_REDIRECT_URI: "https://email.dev.quantumshift.qzz.io/api/v1/email/outlook/callback"
  # Keycloak
  KEYCLOAK_URL: "https://keycloak.example.com"
  KEYCLOAK_REALM: "<realm>"
  KEYCLOAK_CLIENT_ID: "<client-id>"
---
# Placeholder values only. Do not commit real secrets; create them with
# kubectl create secret generic email-service-secrets --from-literal=...
# or a secrets manager (Sealed Secrets, External Secrets, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: email-service-secrets
  namespace: emails
  labels:
    app: email-service
type: Opaque
stringData:
  MAIL_PASS: "changeme"
  SMTP_PASSWORD: "changeme"
  OUTLOOK_PASSWORD: "changeme"
  OUTLOOK_CLIENT_SECRET: "changeme"
  OUTLOOK_REFRESH_TOKEN: ""
  KEYCLOAK_SECRET: "changeme"
