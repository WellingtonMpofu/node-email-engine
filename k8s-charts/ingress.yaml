apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: email-service-http
  namespace: emails
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`email.dev.quantumshift.qzz.io`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: email-service
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: email-service-https
  namespace: emails
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`email.dev.quantumshift.qzz.io`)
      kind: Rule
      middlewares:
        - name: email-service-security-headers
      services:
        - name: email-service
          port: 80
  tls:
    certResolver: myresolver
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: email-service-security-headers
  namespace: emails
spec:
  # Browser security headers for the API, its Swagger UI (/api-docs) and the
  # Outlook OAuth callback page. Traefik sets these on every response the
  # backend returns, including 4xx/5xx, and overwrites any upstream copy.
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Enforced minimal CSP (anti-clickjacking); the full policy below is report-only until tuned
    contentSecurityPolicy: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"
    customResponseHeaders:
      Cross-Origin-Opener-Policy: "same-origin"
      Content-Security-Policy-Report-Only: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'"
      # An empty value strips the header from the upstream response
      X-Powered-By: ""
      Server: ""
